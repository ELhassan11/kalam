[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalam"
version = "0.1.0"
description = "A small Arabic-first language model, built from scratch with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alhassan Ebrahim Abdelraziq" }]

[tool.setuptools]
packages = ["kalam"]
